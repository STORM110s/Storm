<title>STORM — تعلّم البرمجة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a24;--s:#15133a;--s2:#1d1a4f;--cd:#13113a;--t:#eef0ff;--m:#a7a9d8;--b:#6d4aff;--b2:#5a3ae8;--l:#2b2870;--ok:#34d399;--no:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#fff;--s:#f2f6ff;--s2:#f2f6ff;--cd:#fff;--t:#0b1b3a;--m:#5b6b8c;--b:#5b3df5;--b2:#4a2fd6;--l:#dbe7ff;--ok:#16a34a;--no:#dc2626;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:500 1rem/1.7 Tajawal,Tahoma,Arial,sans-serif;max-width:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:16px;padding:10px 18px}
.logo{font-weight:800;font-size:24px;color:var(--b);letter-spacing:1px;cursor:pointer;direction:ltr}
nav{display:flex;gap:4px;margin-inline-start:auto}
nav a{color:var(--m);text-decoration:none;padding:8px 14px;border-radius:12px;font-weight:700;font-size:15px;transition:.2s;display:flex;gap:6px;align-items:center}
nav a.on,nav a:hover{background:var(--s);color:var(--b)}
@media(max-width:767px){nav{position:fixed;bottom:0;inset-inline:0;margin:0;background:var(--bg);border-top:1px solid var(--l);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:9}nav a{flex-direction:column;gap:0;font-size:11px;padding:4px 8px}main{padding-bottom:90px!important}}
main{max-width:980px;margin:auto;padding:20px 16px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1{font-size:28px;margin:0 0 6px}h2{font-size:20px;margin:22px 0 10px}p{margin:6px 0}.m{color:var(--m)}
.card{background:var(--cd);border:1px solid var(--l);border-radius:18px;padding:16px}.card.s{background:var(--s2);border-color:transparent}
.hero{background:linear-gradient(135deg,#4c1d95,#6d4aff);color:#fff;border-radius:22px;padding:22px}.hero .m{color:#dbe7ff}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.btn{background:var(--b);color:#fff;border:0;border-radius:12px;padding:10px 18px;font:700 15px Tajawal,sans-serif;cursor:pointer;transition:.15s}.btn:hover{background:var(--b2)}.btn:active{transform:scale(.97)}
.btn.o{background:transparent;color:var(--b);border:1.5px solid var(--b)}.btn.w{background:#fff;color:#4a2fd6}
.bar{height:10px;background:var(--l);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b);border-radius:9px;transition:width .5s}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;background:var(--s);color:var(--b);font-size:13px;font-weight:700;margin-inline-end:6px;border:0;cursor:pointer;font-family:inherit}.chip.on{background:var(--b);color:#fff}
.stat{font-size:26px;font-weight:800;color:var(--b)}
pre{direction:ltr;text-align:left;background:#07071a;color:#cfe0ff;padding:12px;border-radius:12px;overflow-x:auto;font:14px/1.6 Consolas,monospace;margin:8px 0}
textarea,input{width:100%;border:1.5px solid var(--l);border-radius:12px;padding:10px 12px;font:15px Tajawal,sans-serif;background:var(--bg);color:var(--t);margin:6px 0}
textarea{direction:ltr;text-align:left;font-family:Consolas,monospace;min-height:80px}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.opt{display:block;width:100%;text-align:start;margin:6px 0;padding:10px 14px;border-radius:12px;border:1.5px solid var(--l);background:var(--bg);color:var(--t);font:600 15px Tajawal,sans-serif;cursor:pointer;transition:.15s}.opt:hover,.opt.sel{border-color:var(--b);background:var(--s)}.opt.ok{border-color:var(--ok);background:#16a34a22}.opt.no{border-color:var(--no);background:#dc262622}
.ok{color:var(--ok)}.no{color:var(--no)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:start;border-bottom:1px solid var(--l)}tr.me td{background:var(--s);font-weight:800;color:var(--b)}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--b);color:#fff;padding:10px 18px;border-radius:14px;z-index:20;transition:.3s;opacity:0;pointer-events:none}.toast.on{opacity:1}
.bd{text-align:center;padding:10px}.bd b{font-size:34px;display:block}.bd.lock{opacity:.3;filter:grayscale(1)}

:10px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:var(--s)}.dot{width:12px;height:12px;border-radius:50%;background:#34d399;display:inline-block}#cs{margin:0;border-radius:0;flex:1;min-height:180px;color:#eaeaff;white-space:pre-wrap;background:#07071a}#ln{font-size:var(--edfs,14px)!important}#cr{display:flex;gap:8px;align-items:center;padding:8px 12px;background:#0a0a22;color:#eaeaff;direction:ltr}#cr input{margin:0;flex:1}.calm *{animation:none!important;transition:none!important}#edt{font-size:var(--edfs,14px)!important}.lvb{flex:1;max-width:240px;font-size:13px;font-weight:800;color:var(--b)}.lvb .bar{height:12px;margin-top:2px}.lvb i{background:linear-gradient(90deg,#a78bfa,#6d4aff);transition:width 1s cubic-bezier(.2,.8,.2,1)}

const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbk(pw,salt){if(!window.crypto||!crypto.subtle)throw'المتصفح لا يدعم التشفير الآمن';const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},k,256))}
async function mkPw(pw){const s=crypto.getRandomValues(new Uint8Array(16));return{s:b64(s),h:await pbk(pw,s)}}
async function verifyPw(u,pw){if(u.guest)return false;if(u.pw)return(await pbk(pw,unb64(u.pw.s)))===u.pw.h;if(typeof u.ph=='number'&&u.ph===hash(pw)){u.pw=await mkPw(pw);delete u.ph;return true}return false}
function okPw(pw,name){if(pw.length<8||!/\d/.test(pw)||!/[^\d\s]/.test(pw))throw'كلمة المرور يجب أن تكون 8 أحرف على الأقل وتجمع حروفاً وأرقاماً';if(['12345678','password1','11111111','qwerty123'].includes(pw.toLowerCase())||(name&&pw.toLowerCase().includes(name.toLowerCase())))throw'كلمة المرور سهلة التخمين، اختر غيرها'}

function chV(){const list=CH.filter(c=>fl=='الكل'||c.d==fl);return `<h1>التحديات البرمجية</h1><p class="m">تحدٍّ جديد كل يوم، بمستويات مختلفة.</p><div style="margin:10px 0">${['الكل','سهل','متوسط','صعب'].map(f=>`<button class="chip ${f==fl?'on':''}" onclick="fl='${f}';render()">${f}</button>`).join('')}</div>
<div class="grid">${list.map(c=>{const dn=U.ch[c.id],td=CH[day()%CH.length].id==c.id;return `<div class="card"><span class="chip">${c.d}</span><span class="chip">${c.o?'اختيار من متعدد':'برمجة'}</span>${td?'<span class="chip on">تحدي اليوم</span>':''}<p><b>${c.q}</b></p>
${c.o?c.o.map((o,j)=>`<button class="opt" dir="auto" ${dn?'disabled':''} onclick="ansCh(${c.id},${j},this)">${esc(o)}</button>`).join(''):`<textarea id="cx${c.id}" ${dn?'disabled':''}></textarea><button class="btn" ${dn?'disabled':''} onclick="codeCh(${c.id})">تحقق</button>`}<p id="cr${c.id}">${dn?'<b class="ok">✓ منجز</b>':''}</p></div>`}).join('')}</div>`}
function doneCh(c,ok){if(!ok){$('#cr'+c.id).innerHTML='<b class="no">✗ حاول مرة أخرى</b>';return}if(U.ch[c.id])return;U.ch[c.id]=1;const td=CH[day()%CH.length].id==c.id;if(td)U.ch['d'+day()]=1;add(c.xp*(td?2:1),'تحدٍّ '+c.d);$('#cr'+c.id).innerHTML='<b class="ok">✓ أحسنت!</b>'}
const ansCh=(id,j,b)=>{const c=CH.find(x=>x.id==id);b.classList.add(j==c.a?'ok':'no');doneCh(c,j==c.a)},codeCh=id=>{const c=CH.find(x=>x.id==id);doneCh(c,c.re.test($('#cx'+id).value.trim()))};
/* Tournament */
function lbV(){const me=[dn(),U[tab]];const r=[...LB[tab],me].sort((a,b)=>b[1]-a[1]);return `<div style="margin:8px 0"><button class="chip ${tab=='wk'?'on':''}" onclick="tab='wk';render()">أسبوعي</button><button class="chip ${tab=='mo'?'on':''}" onclick="tab='mo';render()">شهري</button></div><div class="card"><table>${r.map((p,i)=>`<tr class="${p[0]==me[0]&&p[1]==me[1]?'me':''}"><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(p[0])}</td><td>${p[1]} نقطة</td></tr>`).join('')}</table></div>`}
function tournV(){if(!T)return `<h1>🏆 البطولات</h1><div class="hero"><h2 style="margin:0">بطولة STORM الأسبوعية</h2><p class="m">3 جولات، سؤالان في كل جولة، 15 ثانية للسؤال.</p><button class="btn w" onclick="tStart()">ابدأ البطولة</button></div>
<div class="card s" style="margin-top:12px"><b>نظام النقاط العادل</b><p>• إجابة صحيحة = 100 نقطة.<br>• مكافأة السرعة حتى 20 نقطة فقط (أقل من خُمس الدرجة).<br>• الإجابة الخاطئة = صفر مهما كانت سرعتك، لذا الدقة هي الأهم.</p></div><h2>التصنيف</h2>${lbV()}<h2>أوسمتك</h2>${badgesV()}`;
 if(T.st=='end')return tEnd();const q=TQ[T.i],r=Math.floor(T.i/2)+1;
 if(T.st=='round')return `<h1>نتائج الجولة ${r-1}</h1>${standV()}<button class="btn" style="margin-top:12px" onclick="tQ()">الجولة ${r}</button>`;
 return `<p class="m">الجولة ${r}/3 · السؤال ${T.i%2+1}/2 · نقاطك: <b>${T.s}</b></p><div class="bar"><i id="tb" style="width:100%;transition:none"></i></div><div class="card" style="margin-top:12px"><h2 style="margin-top:0" dir="auto">${q[0]}</h2>${q[1].map((o,j)=>`<button class="opt" dir="auto" ${T.st=='fb'?'disabled':''} onclick="tAns(${j})" id="o${j}">${esc(o)}</button>`).join('')}${T.st=='fb'?`<p>${T.f}</p><button class="btn" onclick="tNext()">التالي</button>`:''}</div>`}
const standV=()=>{const r=[...T.bots.map(b=>[b.n,b.s]),[dn(),T.s]].sort((a,b)=>b[1]-a[1]);return `<div class="card"><table>${r.map((p,i)=>`<tr class="${p[0]==dn()?'me':''}"><td>${i+1}</td><td>${esc(p[0])}</td><td>${p[1]}</td></tr>`).join('')}</table></div>`};
function tStart(){T={i:0,s:0,c:0,bots:BOTS.map(b=>({n:b[0],p:b[1],s:0}))};tQ()}
function tQ(){T.st='q';T.t0=Date.now();render();clearInterval(tm);tm=setInterval(()=>{const e=(Date.now()-T.t0)/1000,b=$('#tb');if(b)b.style.width=Math.max(0,100-e/15*100)+'%';if(e>=15)tAns(-1)},100)}
function tAns(j){clearInterval(tm);const q=TQ[T.i],e=(Date.now()-T.t0)/1000,ok=j==q[2],pts=ok?100+Math.round(20*Math.max(0,1-e/15)):0;T.s+=pts;if(ok)T.c++;T.bots.forEach(b=>{if(Math.random()<b.p)b.s+=100+Math.round(20*Math.random())});T.f=ok?`<b class="ok">✓ صحيح! +${pts} (دقة 100 + سرعة ${pts-100})</b>`:`<b class="no">✗ ${j<0?'انتهى الوقت':'خطأ'} · الصحيح: ${esc(q[1][q[2]])}</b>`;T.st='fb';render();$('#o'+q[2]).classList.add('ok');if(j>=0&&!ok)$('#o'+j).classList.add('no')}
function tNext(){T.i++;if(T.i>=TQ.length){T.st='end';const rank=[...T.bots.map(b=>b.s),T.s].sort((a,b)=>b-a).indexOf(T.s)+1;U.wk+=T.s;U.mo+=T.s;U.tn.push({d:Date.now(),s:T.s,rank});T.rank=rank;add(Math.round(T.s/10),'بطولة · المركز '+rank);render()}else if(T.i%2==0){T.st='round';render()}else tQ()}
function tEnd(){return `<div class="hero"><h1>${['🥇','🥈','🥉'][T.rank-1]||'🎯'} المركز ${T.rank} من 6</h1><p class="m">${T.s} نقطة · ${T.c}/6 إجابات صحيحة</p></div><h2>الترتيب النهائي</h2>${standV()}<div style="margin-top:12px"><button class="btn" onclick="T=null;render()">العودة للبطولات</button></div>`}
/* Profile */
const badgesV=()=>`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(90px,1fr))">${BADGES.map(b=>`<div class="card bd ${U.badges.includes(b[0])?'':'lock'}"><b>${b[2]}</b>${b[1]}</div>`).join('')}</div>`;
const profV=()=>`<div class="hero"><h1>${esc(U.name)}</h1><p class="m">لقبك هو ما يراه الآخرون. بريدك خاص ولا يظهر لأحد.</p><div style="display:flex;gap:6px"><input id="nk" value="${esc(U.name)}" maxlength="20" style="margin:0"><button class="btn w" onclick="setNick()">حفظ اللقب</button></div></div><div class="grid" style="margin-top:12px"><div class="card s"><p class="m">المستوى</p><div class="stat">${lvl(U.xp)}</div></div><div class="card s"><p class="m">XP</p><div class="stat">${U.xp}</div></div><div class="card s"><p class="m">بطولات</p><div class="stat">${U.tn.length}</div></div></div>
${U.guest?upCard():''}<h2>الإنجازات والأوسمة</h2>${badgesV()}<h2>التقدم في اللغات</h2>${Object.entries(LANGS).map(([k,v])=>`<p>${v.i} ${v.n} — ${prog(k)}%</p><div class="bar"><i style="width:${prog(k)}%"></i></div>`).join('')}
<h2>سجل التعلّم</h2><div class="card">${U.hist.length?`<table>${U.hist.map(h=>`<tr><td>${new Date(h.t).toLocaleDateString('ar')}</td><td>${esc(h.txt)}</td><td class="ok">+${h.xp}</td></tr>`).join('')}</table>`:'<p class="m">لا يوجد نشاط بعد. ابدأ بأول درس!</p>'}</div>
${bkCard()}<button class="btn o" style="margin-top:16px" onclick="outBtn()">تسجيل الخروج</button>`;
/* Router */
function render(){clearInterval(tm);U=API.session();updLv();applySet();if(!U)return authV(0);const [r,a]=(location.hash.slice(1)||'home').split('-');
 const N=[['home','الرئيسية','🏠'],['learn','الدروس','📚'],['tournament','البطولات','🏆'],['challenges','التحديات','🎯'],['editor','المحرر','💻'],['profile','حسابي','👤']];
 const cur=['lang','lesson'].includes(r)?'learn':r;$('#nav').innerHTML=N.map(n=>`<a href="#${n[0]}" class="${n[0]==cur?'on':''}"><span>${n[2]}</span>${n[1]}</a>`).join('');
 const a2=a&&(a.length>3?LES[a]:LANGS[a]);let h;
 if(r=='lang'&&LANGS[a])h=langV(a);else if(r=='lesson'&&LES[a])h=lessonV(a);else if(r=='learn')h=learnV();else if(r=='tournament')h=tournV();else if(r=='challenges')h=chV();else if(r=='editor')h=edV();else if(r=='profile')h=prof2V();else h=homeV();
 const m=$('#app');m.innerHTML=h;m.style.animation='none';m.offsetWidth;m.style.animation='';if(T&&T.st=='q'&&r=='tournament'){clearInterval(tm);tm=setInterval(()=>{const e=(Date.now()-T.t0)/1000,b=$('#tb');if(b)b.style.width=Math.max(0,100-e/15*100)+'%';if(e>=15)tAns(-1)},100)}}
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});render();
</script>

</body></html>
